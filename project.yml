name: MusiCollab
options:
  bundleIdPrefix: com.example
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
targets:
  MusiCollab:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: MusiCollab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusiCollab
        DEVELOPMENT_TEAM: L4Q834S9XV
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect nearby iPhones for a shared music session."
        INFOPLIST_KEY_UIFileSharingEnabled: true
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
    info:
      path: MusiCollab/Info.plist
      properties:
        MusiCollabServerURL: "ws://192.168.29.33:8787/ws"
        NSLocalNetworkUsageDescription: "Connect nearby iPhones for a shared music session."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _musicollab._tcp
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
