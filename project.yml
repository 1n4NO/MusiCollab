name: MusiCollab
options:
  bundleIdPrefix: com.example
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  MusiCollab:
    build:
      targets:
        MusiCollab: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  MusiCollab:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: MusiCollab
    resources:
      - path: MusiCollab/LaunchScreen.storyboard
      - path: MusiCollab/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusiCollab
        DEVELOPMENT_TEAM: L4Q834S9XV
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.16"
        CURRENT_PROJECT_VERSION: "17"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect nearby iPhones for a shared music session."
        INFOPLIST_KEY_UIFileSharingEnabled: true
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
    info:
      path: MusiCollab/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MusiCollabServerURL: "ws://192.168.29.33:8787/ws"
        NSLocalNetworkUsageDescription: "Connect nearby iPhones for a shared music session."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _musicollab._tcp
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
