<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MusiCollab Companion</title>
  <link rel="manifest" href="/companion/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root{color-scheme:dark;--bg:#0b0e13;--panel:#171c24;--line:#2a323f;--text:#f5f7fb;--muted:#8f9aaa;--cyan:#48e6f2;--coral:#ff5757;--violet:#a875ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}main{max-width:980px;margin:0 auto;padding:22px}.top{display:flex;align-items:center;gap:16px}.brand{font-size:22px;font-weight:900;letter-spacing:.08em}.sub,.hint{color:var(--muted)}.status{margin-left:auto;color:var(--muted);font-size:12px;font-weight:800}.dot{color:var(--coral)}.dot.connected{color:var(--cyan)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0}.button{border:1px solid var(--line);background:var(--panel);border-radius:9px;color:var(--text);padding:11px 14px;font-weight:800}.room{margin-left:auto;color:var(--muted);font-size:12px}.room b{color:var(--text)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.kicker{color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.1em;margin-bottom:12px}.wave{height:150px;border-radius:10px;background:#10141b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}.bars{height:100%;width:92%;display:flex;align-items:center;gap:4px}.bar{flex:1;background:var(--violet);border-radius:3px;min-width:2px}.queue{display:flex;gap:8px;margin-top:14px}.queue input{min-width:0;flex:1;border:1px solid var(--line);background:#10141b;color:var(--text);border-radius:8px;padding:11px}.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.role{color:var(--cyan);font-size:11px;font-weight:800}.queueActions{display:flex;gap:4px}.queueAction{border:1px solid var(--line);background:#10141b;color:var(--muted);border-radius:5px;padding:4px 6px;font-size:11px}.log{height:150px;overflow:auto;color:var(--muted);font:12px ui-monospace,monospace;white-space:pre-wrap}@media(max-width:700px){main{padding:14px}.grid{grid-template-columns:1fr}.room{margin-left:0;width:100%}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div><div class="brand">MUSICOLLAB</div><div class="sub">Companion / queue + waveform</div></div><div class="beat" id="beat">BEAT 0.00</div><div class="status"><span id="dot" class="dot">●</span> <span id="status">connecting</span></div></header>
    <section class="toolbar"><button class="button" id="refresh">↻ REFRESH VIEW</button><button class="button" id="clear">CLEAR QUEUE</button><div class="room">ROOM <b id="room">LOCAL</b></div></section>
    <div class="grid"><section class="panel"><div class="kicker">SAMPLE WAVEFORM</div><div class="wave"><div class="bars" id="bars"></div></div><div class="queue"><input id="track" placeholder="Track or sample name" aria-label="Track or sample name"><button class="button" id="add">QUEUE</button></div><div class="hint" id="queueHint">Companion actions are intentionally non-latency-sensitive.</div><div class="kicker" style="margin-top:22px">QUEUE</div><div id="queueList"><div class="hint">Nothing queued.</div></div></section><aside class="panel"><div class="kicker">PERFORMER CONTROL</div><label class="item"><span>Instrument</span><select id="instrument" aria-label="Instrument"><option value="drums">Drums</option><option value="bass">Bass</option><option value="keys">Keys</option><option value="sampler">Sampler</option></select></label><label class="item"><span>Pitch <b id="pitchValue">0</b> st</span><input id="pitch" type="range" min="-24" max="24" step="1" value="0" aria-label="Pitch in semitones"></label><button class="button" id="applyInstrument">APPLY TO iPHONE 14</button><div class="hint" id="instrumentState">No performer control sent yet.</div><div class="kicker" style="margin-top:22px">CONNECTED CLIENTS</div><div id="clients"><div class="hint">Waiting for clients…</div></div><div class="kicker" style="margin-top:22px">SESSION EVENTS</div><div class="log" id="log"></div></aside></div>
  </main>
  <script>
    const params=new URLSearchParams(location.search), room=(params.get('room')||'LOCAL').toUpperCase();
    const state={queue:[]}; const pending={}; let ws=null, retry=null, delay=1000;
    const $=id=>document.querySelector('#'+id); $('room').textContent=room;
    for(let i=0;i<64;i++){const bar=document.createElement('i');bar.className='bar';bar.style.height=`${18+Math.abs(Math.sin(i*1.7))*70}%`;$('bars').append(bar)}
    function log(message){$('log').textContent=`${new Date().toLocaleTimeString()}  ${message}\n`+$('log').textContent}
    function renderQueue(){ $('queueList').innerHTML=state.queue.map((item,index)=>`<div class="item"><span>${index+1}. ${item}</span><span class="queueActions"><button class="queueAction" data-action="up" data-index="${index}">↑</button><button class="queueAction" data-action="down" data-index="${index}">↓</button><button class="queueAction" data-action="remove" data-index="${index}">×</button></span></div>`).join('')||'<div class="hint">Nothing queued.</div>'; }
    function renderSample(sample){if(!sample){$('queueHint').textContent='Companion actions are intentionally non-latency-sensitive.';return}const slices=Array.isArray(sample.slices)?sample.slices:[];$('queueHint').textContent=`${sample.name||'Sample'} / ${Number(sample.duration||0).toFixed(1)}s / ${slices.length} slices`;Array.from(document.querySelectorAll('#bars .bar')).forEach((bar,index)=>bar.style.background=slices.length&&index%slices.length===0?'var(--cyan)':'var(--violet)')}
    function renderClock(message){$('beat').textContent=`BEAT ${Number(message.beat||0).toFixed(2)}`}
    function renderClients(list){$('clients').innerHTML=list.map(c=>`<div class="item"><span>${c.name}</span><span class="role">${c.role}</span></div>`).join('')||'<div class="hint">Waiting for clients…</div>'}
    function eventID(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}
    function send(eventType,payload){if(ws&&ws.readyState===WebSocket.OPEN){const requestID=eventID();pending[requestID]=eventType;ws.send(JSON.stringify({type:'event',eventType,payload,eventID:eventID(),requestID}));return requestID}return null}
    function schedule(){if(retry)return;$('status').textContent='reconnecting';$('dot').classList.remove('connected');retry=setTimeout(()=>{retry=null;connect()},delay);delay=Math.min(delay*2,10000)}
    function connect(){ws=new WebSocket(`ws://${location.host}/ws`);ws.onopen=()=>{delay=1000;$('status').textContent='connected';$('dot').classList.add('connected');ws.send(JSON.stringify({type:'hello',room,clientID:'iphone6plus-companion',name:'iPhone 6 Plus',role:'companion'}));log('joined room')};ws.onclose=()=>{log('connection closed — retrying');schedule()};ws.onerror=()=>{log('socket error');$('status').textContent='socket error'};ws.onmessage=({data})=>{const m=JSON.parse(data);if(m.type==='clock')renderClock(m);if(m.type==='ack'&&m.requestID&&pending[m.requestID]){const command=pending[m.requestID];delete pending[m.requestID];$('instrumentState').textContent=`${command.toUpperCase()} acknowledged`;log(`${command} acknowledged`)}if(m.type==='error'){log(`${m.code}: ${m.message}`);$('instrumentState').textContent='Command rejected'}if(m.type==='snapshot'){state.queue=m.state.queue||[];renderQueue();renderClients(m.clients);renderSample(m.state.sample)}if(m.type==='roster')renderClients(m.clients);if(m.type==='event'){if(m.eventType==='queue'){state.queue=m.payload.items||[];renderQueue()}if(m.eventType==='sample')renderSample(m.payload);log(`${m.eventType} from ${m.sender}`)}}}
    $('add').onclick=()=>{const value=$('track').value.trim();if(!value)return;state.queue.push(value);$('track').value='';send('queue',{items:state.queue});renderQueue();log(`queued ${value}`)};
    $('queueList').onclick=event=>{const button=event.target.closest('.queueAction');if(!button)return;const index=Number(button.getAttribute('data-index')),action=button.getAttribute('data-action');if(action==='remove')state.queue.splice(index,1);if(action==='up'&&index>0)[state.queue[index-1],state.queue[index]]=[state.queue[index],state.queue[index-1]];if(action==='down'&&index<state.queue.length-1)[state.queue[index+1],state.queue[index]]=[state.queue[index],state.queue[index+1]];send('queue',{items:state.queue});renderQueue();log(`queue ${action}`)};
    $('clear').onclick=()=>{state.queue=[];send('queue',{items:[]});renderQueue();log('queue cleared')}; $('refresh').onclick=()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'requestSnapshot',requestID:eventID()}))}; connect();
    $('pitch').oninput=()=>{$('pitchValue').textContent=$('pitch').value};
    $('applyInstrument').onclick=()=>{const instrument=$('instrument').value,pitch=Number($('pitch').value);send('instrument',{instrument,pitch});$('instrumentState').textContent=`${instrument.toUpperCase()} / ${pitch>0?'+':''}${pitch} st sent`;log(`instrument ${instrument}, pitch ${pitch}`)};
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/companion/sw.js',{scope:'/companion/'}).catch(()=>log('offline install unavailable'));
  </script>
</body>
</html>
